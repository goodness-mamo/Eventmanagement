
name: Event Management System CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET Version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore EventManagementApi.slnx

      - name: Build Solution
        run: dotnet build EventManagementApi.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test EventManagementApi.Tests/EventManagementApi.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Event-Management-Test-Results
          path: '**/test-results.trx'
          if-no-files-found: ignore
