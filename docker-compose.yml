
services:
  eventmanagement-mvc:
    build:
      context: .
      dockerfile: EventManagement.Mvc/Dockerfile
    container_name: raceday-mvc
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ApiSettings__BaseUrl: "http://host.docker.internal:5237/"
    restart: unless-stopped
